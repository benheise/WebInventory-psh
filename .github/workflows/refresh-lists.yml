# Weekly: pull the newest versions of the external lists WebInventory is built from (Rapid7 Recog, webappanalyzer,
# the NVD CPE Dictionary and CVE feeds, CISA KEV, nuclei-templates and WhatWeb for the version-candidate index),
# rebuild, run the offline tests and open a pull request for review. Nothing is merged automatically.
# Needs: Settings > Actions > General > Workflow permissions: "Allow GitHub Actions to create and approve pull requests".
name: Refresh external lists

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Re-import the rule packs even if their upstream commit did not change
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-lists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      status: ${{ steps.refresh.outputs.status }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: PyYAML for the nuclei-templates index (the other tools use the standard library)
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml
      - name: Refresh, rebuild, test
        id: refresh
        run: |
          set +e
          bash tools/refresh/refresh.sh --work "$RUNNER_TEMP/wi-refresh" ${{ inputs.force && '--force' || '' }}
          rc=$?
          echo "status=$rc" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/wi-refresh/summary.md" ] && cat "$RUNNER_TEMP/wi-refresh/summary.md" >> "$GITHUB_STEP_SUMMARY"
          case $rc in 0|10|11) exit 0 ;; *) exit $rc ;; esac
      - name: Keep the summary, CPE candidates and logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wi-refresh/summary.md
            ${{ runner.temp }}/wi-refresh/review.txt
            ${{ runner.temp }}/wi-refresh/failures.txt
            ${{ runner.temp }}/wi-refresh/coverage.*.txt
            ${{ runner.temp }}/wi-refresh/logs/
          if-no-files-found: ignore
      - name: Open or update the pull request
        id: pr
        if: steps.refresh.outputs.status == '10' || steps.refresh.outputs.status == '11'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.refresh.outputs.status }}
        run: |
          branch="refresh/external-lists"
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -A
          git commit -q -m "Refresh external lists ($(date -u +%Y-%m-%d))" -m "Generated by .github/workflows/refresh-lists.yml; see the pull request for the summary."
          git push -f origin "$branch"
          title="Refresh external lists ($(date -u +%Y-%m-%d))"
          [ "$STATUS" = 11 ] && title="$title: checks failed"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/wi-refresh/summary.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/wi-refresh/summary.md"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  windows:
    # a pull request opened with the workflow token starts no other workflow, so the Windows check runs here
    needs: refresh
    if: needs.refresh.outputs.branch != ''
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.refresh.outputs.branch }}
      - name: Windows PowerShell 5.1 self-test, rule examples and store validation
        id: win
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $s = Join-Path $env:GITHUB_WORKSPACE 'dist\Invoke-WebInventory.ps1'
          $out = @()
          $out += (powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s -SelfTest 2>&1 | Select-Object -Last 1); $a = $LASTEXITCODE
          $out += (powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s -TestRules 2>&1 | Select-Object -Last 1); $b = $LASTEXITCODE
          $out += (powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'dist\Test-WebInventoryStore.ps1') -Services 2000 2>&1 | Select-Object -Last 1); $c = $LASTEXITCODE
          $ok = -not ($a -or $b -or $c)
          $body = "Windows PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString): " + $(if ($ok) { 'passed' } else { '**failed**' }) + "`n`n" + (($out | ForEach-Object { "- $_" }) -join "`n")
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'win.md') -Value $body -Encoding utf8
          gh pr comment '${{ needs.refresh.outputs.branch }}' --body-file (Join-Path $env:RUNNER_TEMP 'win.md')
          if (-not $ok) { exit 1 }

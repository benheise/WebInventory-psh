# Offline checks of the release files: the build is reproducible from src/, and the self-test, the rule examples and
# the store validation pass on Windows PowerShell 5.1 (ESENT) and on PowerShell 7. Nothing is scanned.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: C# blocks through Windows PowerShell 5.1's compiler, warnings as errors
        # the same compiler Add-Type uses on Windows PowerShell 5.1 (CodeDom csc, C# 5); the script itself compiles with
        # IgnoreWarnings so that a warning never stops it on a scanner host, and this step keeps the code warning-free
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host ("::error title=C# compile step::{0}" -f (($_ | Out-String) -replace '\r?\n', ' ')); exit 1 }
          $script = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'dist\Invoke-WebInventory.ps1'))
          $refs = @{ EngineSource = @('System.dll', 'System.Core.dll', 'System.Security.dll', 'System.Runtime.Serialization.dll', 'System.Xml.dll')
                     ExtrasSource = @('System.dll', 'System.Core.dll'); StoreSource = @('System.dll', 'System.Core.dll') }
          $failed = 0
          foreach ($b in 'EngineSource', 'ExtrasSource', 'StoreSource') {
              if ($script -notmatch "(?s)\`$$b = @'\r?\n(.*?)\r?\n'@") { Write-Host "::error title=$b::block not found"; $failed++; continue }
              $src = $Matches[1]; $lines = $src -split "\r?\n"
              $cp = New-Object System.CodeDom.Compiler.CompilerParameters
              $cp.ReferencedAssemblies.AddRange([string[]]$refs[$b]); $cp.WarningLevel = 4; $cp.TreatWarningsAsErrors = $false
              $cp.GenerateInMemory = $false; $cp.OutputAssembly = Join-Path $env:RUNNER_TEMP "$b.dll"
              $r = (New-Object Microsoft.CSharp.CSharpCodeProvider).CompileAssemblyFromSource($cp, $src)
              $diags = @($r.Errors)
              $sum = "{0}: {1} errors, {2} warnings ({3} lines)" -f $b, @($diags | Where-Object { -not $_.IsWarning }).Count, @($diags | Where-Object IsWarning).Count, $lines.Count
              Write-Host ("::{0} title=csc {1}::{2}" -f $(if ($diags.Count) { 'error' } else { 'notice' }), $b, $sum)
              $i = 0
              foreach ($d in $diags) {
                  $text = if ($d.Line -gt 0 -and $d.Line -le $lines.Count) { $lines[$d.Line - 1].Trim() } else { '' }
                  $msg = ('{0} line {1}: {2} {3} | {4}' -f $b, $d.Line, $d.ErrorNumber, $d.ErrorText, $text) -replace '::', ': :' -replace '[\r\n%]', ' '
                  Write-Host $msg
                  if ($i++ -lt 9) { Write-Host ('::{0} title={1} {2}::{3}' -f $(if ($d.IsWarning) { 'warning' } else { 'error' }), $b, $d.ErrorNumber, $msg) }
              }
              if ($diags.Count) { $failed++ }
          }
          if ($failed) { exit 1 }
      - name: Self-test (includes ESENT conformance) and rule examples
        if: success() || failure()
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'   # Actions sets Stop; a line on a child's stderr must not end the step
          # failing checks and the result lines become annotations, so they show on the commit and the pull request
          function Invoke-Check([string]$Title, [string[]]$Arguments) {
              $out = @(powershell.exe -NoProfile -ExecutionPolicy Bypass @Arguments 2>&1 | ForEach-Object { "$_" })
              $rc = $LASTEXITCODE
              # Write-Host, not the pipeline: the function's only output is the exit code
              $out | ForEach-Object { Write-Host $_ }
              $out | Where-Object { $_ -match '^\s*FAIL\b' } | Select-Object -First 9 | ForEach-Object { Write-Host "::error title=$Title::$_" }
              $last = @($out | Where-Object { $_.Trim() }) | Select-Object -Last 1
              Write-Host ("::{0} title={1}::{2} (exit {3})" -f $(if ($rc) { 'error' } else { 'notice' }), $Title, $last, $rc)
              return $rc
          }
          "Windows PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)"
          $s = Join-Path $env:GITHUB_WORKSPACE 'dist\Invoke-WebInventory.ps1'
          $a = Invoke-Check 'SelfTest (Windows PowerShell 5.1)' @('-File', $s, '-SelfTest')
          $b = Invoke-Check 'TestRules (Windows PowerShell 5.1)' @('-File', $s, '-TestRules')
          if ($a -or $b) {
              Get-ChildItem -Filter 'WebInventory_*_error.log' | Get-Content | Select-Object -First 9 | ForEach-Object { Write-Output "::warning title=error log::$_" }
              exit 1
          }
      - name: Cloud ranges against a Python oracle; CNAME chains against Resolve-DnsName (Windows DNS client)
        if: success() || failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host ("::error title=cloud/CNAME step::{0}" -f (($_ | Out-String) -replace '\r?\n', ' ')); exit 1 }
          $rc = 0
          $o = @(python tests/cloud/oracle.py --shell powershell --n 20000 2>&1 | ForEach-Object { "$_" }); $orc = $LASTEXITCODE
          $o | ForEach-Object { Write-Host $_ }
          Write-Host ("::{0} title=cloud lookup (Windows PowerShell 5.1)::{1}" -f $(if ($orc) { 'error' } else { 'notice' }), ($o | Where-Object { $_ -match 'mismatches' } | Select-Object -Last 1))
          if ($orc) { $rc = 1 }
          # the same answers through the same DNS client cache: our DnsQuery_W chain first, then Resolve-DnsName's CNAME records
          $script = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'dist\Invoke-WebInventory.ps1'))
          if ($script -notmatch "(?s)\`$ExtrasSource = @'\r?\n(.*?)\r?\n'@") { throw 'extras block not found' }
          Add-Type -TypeDefinition $Matches[1] -ReferencedAssemblies System.Core -IgnoreWarnings
          $same = 0; $names = 'www.github.com', 'www.microsoft.com', 'www.office.com', 'docs.python.org', 'learn.microsoft.com'
          foreach ($n in $names) {
              $e = $null; $mine = @([WebInv.Cname]::Chain($n, $null, 5000, [ref]$e))
              $ref = @(Resolve-DnsName -Name $n -Type A -ErrorAction Stop | Where-Object { $_.Type -eq 'CNAME' } | ForEach-Object { $_.NameHost.ToLowerInvariant().TrimEnd('.') })
              $ok = $null -eq $e -and ($mine -join ' > ') -eq ($ref -join ' > ')
              if ($ok) { $same++ }
              $line = "{0}: DnsQuery_W [{1}] Resolve-DnsName [{2}] {3}" -f $n, ($mine -join ' > '), ($ref -join ' > '), $(if ($ok) { 'same' } else { "DIFFERENT $e" })
              Write-Host $line
              if (-not $ok) { Write-Host ("::warning title=CNAME differs::{0}" -f $line) }
          }
          Write-Host ("::{0} title=CNAME (Windows DNS client)::{1} of {2} names give the same chain as Resolve-DnsName" -f $(if ($same -eq $names.Count) { 'notice' } else { 'error' }), $same, $names.Count)
          if ($same -ne $names.Count) { $rc = 1 }
          exit $rc
      - name: Store validation (ESENT against the portable engine, hard kills, rebuild)
        if: success() || failure()
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'   # Actions sets Stop; a line on a child's stderr must not end the step
          trap { Write-Host ("::error title=Test-WebInventoryStore step::{0}" -f (($_ | Out-String) -replace '\r?\n', ' ')); exit 1 }
          Write-Host '::notice title=Test-WebInventoryStore::started'
          $out = @(powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'dist\Test-WebInventoryStore.ps1') -Services 2000 2>&1 | ForEach-Object { "$_" })
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $out | Where-Object { $_ -match '^\s*FAIL\b' } | Select-Object -First 9 | ForEach-Object { Write-Host "::error title=Test-WebInventoryStore::$_" }
          Write-Host ("::{0} title=Test-WebInventoryStore::{1} (exit {2})" -f $(if ($rc) { 'error' } else { 'notice' }), (@($out | Where-Object { $_.Trim() }) | Select-Object -Last 1), $rc)
          if ($rc) { Write-Host ("::warning title=Test-WebInventoryStore output (last lines)::{0}" -f ((@($out | Where-Object { $_.Trim() }) | Select-Object -Last 12) -join ' | ' -replace '::', ': :' -replace '[\r\n%]', ' ')) }
          exit $rc
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-logs
          path: |
            ${{ runner.temp }}/WebInventory_*.log
            ${{ runner.temp }}/Test-WebInventoryStore_*.log
          if-no-files-found: ignore

  linux:
    name: Build and PowerShell 7
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The release files are what src/ builds
        run: |
          python3 build.py
          git diff --exit-code --stat -- dist/ || { echo "::error title=Build::dist/ differs from what build.py makes from src/ (run python3 build.py and commit)"; exit 1; }
      - name: Self-test and rule examples
        working-directory: ${{ runner.temp }}
        run: |
          # failing checks and the result lines become annotations, so they show on the commit and the pull request
          check() {
            local title=$1; shift
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/dist/Invoke-WebInventory.ps1" "$@" > out.txt 2>&1; local rc=$?
            cat out.txt
            grep -E '^\s*FAIL\b' out.txt | head -9 | sed "s/^/::error title=$title::/"
            echo "::$([ $rc = 0 ] && echo notice || echo error) title=$title::$(grep -v '^\s*$' out.txt | tail -1) (exit $rc)"
            return $rc
          }
          pwsh -NoProfile -Command '"PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)"'
          rc=0
          check 'SelfTest (PowerShell 7)' -SelfTest || rc=1
          check 'TestRules (PowerShell 7)' -TestRules || rc=1
          if [ $rc != 0 ]; then head -9 WebInventory_*_error.log 2>/dev/null | sed 's/^/::warning title=error log::/'; fi
          exit $rc
      - name: Cloud ranges against a Python oracle; CNAME chains over UDP against dig
        if: success() || failure()
        run: |
          rc=0
          python3 tests/cloud/oracle.py --n 20000 > oracle.txt 2>&1 || rc=1
          cat oracle.txt
          echo "::$([ $rc = 0 ] && echo notice || echo error) title=cloud lookup (PowerShell 7)::$(grep mismatches oracle.txt | tail -1)"
          command -v dig > /dev/null || sudo apt-get install -y -qq dnsutils > /dev/null
          cat > cn.ps1 <<'PS'
          $code = [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/dist/Invoke-WebInventory.ps1")
          if ($code -notmatch "(?s)\`$ExtrasSource = @'\r?\n(.*?)\r?\n'@") { throw 'extras block not found' }
          Add-Type -TypeDefinition $Matches[1] -IgnoreWarnings
          foreach ($n in $args) { $e = $null; $c = [WebInv.Cname]::Chain($n, $null, 5000, [ref]$e); "{0} {1} {2}" -f $n, (@($c) -join '>'), $e }
          PS
          names="www.github.com www.microsoft.com www.office.com docs.python.org learn.microsoft.com"
          pwsh -NoProfile -File cn.ps1 $names > mine.txt
          same=0; total=0
          for n in $names; do
            total=$((total+1))
            ref=$(dig +short "$n" A | grep -E '\.$' | sed 's/\.$//' | tr 'A-Z' 'a-z' | paste -sd '>' -)
            got=$(awk -v n="$n" '$1==n {print $2}' mine.txt)
            echo "$n: UDP [$got] dig [$ref]"
            [ "$got" = "$ref" ] || echo "::warning title=CNAME differs::$n: UDP [$got] dig [$ref]"
            [ "$got" = "$ref" ] && same=$((same+1))
          done
          echo "::$([ $same = $total ] && echo notice || echo error) title=CNAME (UDP, PowerShell 7)::$same of $total names give the same chain as dig"
          [ $same = $total ] || rc=1
          exit $rc
      - name: Checksums match
        working-directory: dist
        run: |
          sha256sum -c --quiet SHA256SUMS.txt > sums.txt 2>&1 || { sed 's/^/::error title=SHA256SUMS::/' sums.txt; echo "::error title=SHA256SUMS::dist/SHA256SUMS.txt is stale (python3 tools/refresh/sha256sums.py dist)"; exit 1; }
